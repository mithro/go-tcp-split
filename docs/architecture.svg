<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-label="A forwarded TCP connection from the laptop is terminated on the VPN server and re-originated from it, so the lossy tunnel leg runs on a server-side BBR socket while the clean leg runs the destination's own congestion control. The interception rules are permanent site firewall configuration, and both systemd units are enabled at boot.">
  <title>tcp-split architecture</title>
  <desc>Top: the data path of one connection. The laptop's traffic arrives on vps through the WireGuard tunnel (the lossy leg) on wg-laptop. An nftables prerouting chain in table inet tcp_split (nat, dstnat - 10) matches iifname wg-laptop, tcp, fib daddr type != local and fib daddr oif eth0. Traffic that does not match (not TCP, a local destination, or a destination not routed via eth0) is handled by the VPN table as before: forward or input chain, masquerade for IPv4. A match is redirected to port 10443: the destination is rewritten to the tunnel's server address while conntrack keeps the original. tcp-split, started at boot with its listeners passed by tcp-split.socket and sandboxed with DynamicUser and an empty read-only root, accepts on its client-facing socket (server-side BBR, where the lossy leg ends), reads SO_ORIGINAL_DST, applies policy (loop, invalid, --deny) and the connection limit, dials the original destination and relays with splice and half-close. The new connection leaves through eth0 with vps's own address as its source, on the clean leg to the destination, which runs its own congestion control over a lossless path. Bottom: tcp-split.socket holds the listeners on the tunnel server addresses with FreeBind and passes the listeners to tcp-split.service; the site enables both units at boot and the proxy runs permanently. No unit loads or removes the nft rules: table inet tcp_split is part of the site's permanent firewall configuration, so while the proxy is down, redirected connections are reset.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#1f2328">

    <!-- ===== Top band: data path ===== -->
    <text x="16" y="30" font-size="14" font-weight="600">Data path of one TCP connection from the laptop</text>

    <!-- laptop -->
    <rect x="16" y="130" width="64" height="60" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
    <text x="48" y="157" font-size="13" font-weight="600" text-anchor="middle">laptop</text>
    <text x="48" y="174" text-anchor="middle" fill="#59636e">client</text>

    <!-- tunnel: lossy leg -->
    <line x1="80" y1="160" x2="178" y2="160" stroke="#1f2328" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="130" y="134" text-anchor="middle">WireGuard</text>
    <text x="130" y="150" text-anchor="middle">tunnel</text>
    <text x="130" y="178" text-anchor="middle" fill="#59636e">lossy leg:</text>
    <text x="130" y="194" text-anchor="middle" fill="#59636e">loss, high RTT</text>

    <!-- vps container -->
    <rect x="220" y="50" width="556" height="440" rx="8" fill="none" stroke="#1f2328" stroke-width="1.5"/>
    <text x="236" y="74" font-size="13" font-weight="600">vps<tspan dx="6" font-size="12" font-weight="400" fill="#59636e">VPN server</tspan></text>

    <!-- ingress port -->
    <rect x="180" y="140" width="80" height="40" rx="4" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
    <text x="220" y="165" text-anchor="middle" font-family="ui-monospace, monospace">wg-laptop</text>

    <line x1="260" y1="160" x2="288" y2="160" stroke="#1f2328" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="274" y="150" text-anchor="middle">SYN</text>

    <!-- nft decision node -->
    <rect x="290" y="90" width="190" height="140" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
    <text x="385" y="111" font-size="13" font-weight="600" text-anchor="middle">nft prerouting</text>
    <text x="385" y="127" text-anchor="middle" fill="#59636e" font-family="ui-monospace, monospace">table inet tcp_split</text>
    <text x="385" y="143" text-anchor="middle" fill="#59636e">nat, dstnat − 10</text>
    <line x1="302" y1="152" x2="468" y2="152" stroke="#d0d7de" stroke-width="1"/>
    <g font-family="ui-monospace, monospace">
      <text x="302" y="172">iifname wg-laptop · tcp</text>
      <text x="302" y="193">fib daddr type != local</text>
      <text x="302" y="214">fib daddr oif eth0</text>
    </g>

    <!-- no match: VPN table as before (secondary) -->
    <line x1="480" y1="160" x2="598" y2="160" stroke="#59636e" stroke-width="1" marker-end="url(#arrow-grey)"/>
    <text x="539" y="150" text-anchor="middle" fill="#59636e">no match</text>
    <text x="539" y="178" text-anchor="middle" fill="#59636e">not TCP, local,</text>
    <text x="539" y="194" text-anchor="middle" fill="#59636e">or not via eth0</text>
    <rect x="600" y="110" width="156" height="100" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1"/>
    <text x="678" y="133" font-weight="600" text-anchor="middle" fill="#59636e">VPN table</text>
    <text x="678" y="150" text-anchor="middle" fill="#59636e">(as before)</text>
    <text x="678" y="174" text-anchor="middle" fill="#59636e">forward or input,</text>
    <text x="678" y="191" text-anchor="middle" fill="#59636e">masquerade (IPv4)</text>

    <!-- match: redirect (accent) -->
    <line x1="340" y1="230" x2="340" y2="308" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
    <text x="352" y="254" font-weight="600" fill="#0969da">match: redirect to :10443</text>
    <text x="352" y="272" fill="#59636e">dst rewritten to the tunnel's server address;</text>
    <text x="352" y="288" fill="#59636e">conntrack keeps the original</text>

    <!-- tcp-split -->
    <rect x="290" y="310" width="360" height="160" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="2"/>
    <text x="306" y="334" font-size="14" font-weight="600" font-family="ui-monospace, monospace">tcp-split</text>
    <g fill="#0969da">
      <text x="306" y="356" font-weight="600">lossy leg ends here</text>
      <text x="306" y="372">client-facing socket:</text>
      <text x="306" y="388">server-side BBR</text>
    </g>
    <g fill="#59636e">
      <text x="306" y="412">listeners from</text>
      <text x="306" y="427" font-family="ui-monospace, monospace">tcp-split.socket</text>
      <text x="306" y="444">DynamicUser,</text>
      <text x="306" y="459">empty read-only root</text>
    </g>
    <line x1="456" y1="322" x2="456" y2="458" stroke="#d0d7de" stroke-width="1"/>
    <g>
      <text x="468" y="332"><tspan font-weight="600">1</tspan><tspan dx="6" font-family="ui-monospace, monospace">SO_ORIGINAL_DST</tspan></text>
      <text x="468" y="360"><tspan font-weight="600">2</tspan><tspan dx="6">policy</tspan></text>
      <text x="468" y="388"><tspan font-weight="600">3</tspan><tspan dx="6">limit</tspan></text>
      <text x="468" y="416"><tspan font-weight="600">4</tspan><tspan dx="6">dial</tspan></text>
      <text x="468" y="444"><tspan font-weight="600">5</tspan><tspan dx="6">relay</tspan></text>
    </g>
    <g fill="#59636e">
      <text x="482" y="346">original destination</text>
      <text x="482" y="374">loop · invalid · --deny</text>
      <text x="482" y="402">--max-conns</text>
      <text x="482" y="430">the original destination</text>
      <text x="482" y="458">splice · half-close</text>
    </g>

    <!-- tcp-split -> eth0 -->
    <line x1="650" y1="390" x2="748" y2="390" stroke="#1f2328" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="700" y="364" text-anchor="middle">source: vps's</text>
    <text x="700" y="380" text-anchor="middle">own address</text>

    <!-- egress port -->
    <rect x="750" y="370" width="50" height="40" rx="4" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
    <text x="775" y="395" text-anchor="middle" font-family="ui-monospace, monospace">eth0</text>

    <!-- clean leg -->
    <line x1="800" y1="390" x2="854" y2="390" stroke="#1f2328" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="828" y="428" text-anchor="middle" fill="#59636e">clean leg,</text>
    <text x="828" y="444" text-anchor="middle" fill="#59636e">no loss</text>

    <!-- destination -->
    <rect x="856" y="360" width="88" height="60" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
    <text x="900" y="387" font-weight="600" text-anchor="middle">destination</text>
    <text x="900" y="404" text-anchor="middle" fill="#59636e">internet</text>

    <!-- clean-leg call-out (accent) -->
    <g fill="#0969da" text-anchor="end">
      <text x="944" y="262" font-weight="600">clean leg:</text>
      <text x="944" y="278">destination's own</text>
      <text x="944" y="294">congestion control,</text>
      <text x="944" y="310">lossless path</text>
    </g>
    <line x1="828" y1="318" x2="828" y2="390" stroke="#0969da" stroke-width="1.5"/>
    <circle cx="828" cy="390" r="3" fill="#0969da"/>

    <!-- ===== Bottom strip: systemd units and the site's rules ===== -->
    <line x1="16" y1="510" x2="944" y2="510" stroke="#d0d7de" stroke-width="1"/>
    <text x="16" y="536" font-size="14" font-weight="600">Running permanently<tspan dx="8" font-size="12" font-weight="400" fill="#59636e">systemd units, both enabled at boot</tspan></text>

    <!-- tcp-split.socket -->
    <rect x="16" y="550" width="200" height="50" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
    <text x="30" y="571" font-size="13" font-weight="600" font-family="ui-monospace, monospace">tcp-split.socket</text>
    <text x="30" y="589" fill="#59636e">enabled at boot</text>

    <!-- passes listeners -->
    <line x1="216" y1="575" x2="332" y2="575" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="274" y="567" text-anchor="middle">passes listeners</text>

    <!-- tcp-split.service -->
    <rect x="334" y="550" width="200" height="50" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/>
    <text x="348" y="571" font-size="13" font-weight="600" font-family="ui-monospace, monospace">tcp-split.service</text>
    <text x="348" y="589" fill="#59636e">enabled at boot</text>

    <!-- the site's rules -->
    <rect x="564" y="550" width="380" height="68" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1"/>
    <text x="578" y="571" font-size="13" font-weight="600">nft rules: permanent site firewall config</text>
    <text x="578" y="589" fill="#59636e">table inet tcp_split · no unit loads or removes it</text>
    <text x="578" y="607" fill="#59636e">proxy down ⇒ redirected connections are reset</text>

    <!-- legend -->
    <line x1="16" y1="644" x2="40" y2="644" stroke="#1f2328" stroke-width="2"/>
    <text x="46" y="648" fill="#59636e">packet path</text>
    <line x1="136" y1="644" x2="160" y2="644" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="166" y="648" fill="#59636e">unit control</text>
  </g>
</svg>
